services:
  - type: web
    name: floorplan-furniture-detect
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL_NAME
        value: claude-haiku-4-5-20251001
      - key: ALLOWED_ORIGINS
        value: "*"
